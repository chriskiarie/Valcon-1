<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 68" role="img" aria-labelledby="logoTitle" width="250" height="68">
  <title id="logoTitle">Valcon Air logo placeholder</title>
  <defs>
    <style>
      .mark {
        fill: none;
        stroke: #45206A;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .valcon {
        font: 700 30px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        fill: #7C74B8;
        letter-spacing: 0.04em;
      }
      .air {
        font: 700 30px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
