  </defs>
  <!-- Placeholder V mark based on the Valcon Air wall sign -->
  <path class="mark" d="M24 12 L35 56 L46 12" />
  <text class="valcon" x="56" y="44">VALCON</text>
  <text class="air" x="152" y="44">AIR</text>
